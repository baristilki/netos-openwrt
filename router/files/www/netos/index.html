<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f6f8">
  <title>NetOS</title>
  <!-- ikonlar: tarayıcı sekmesi, iPhone/iPad ana ekranı, Android/Windows uygulama olarak yükleme -->
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon.ico" sizes="32x32">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.json">
  <meta name="application-name" content="NetOS">
  <meta name="apple-mobile-web-app-title" content="NetOS">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="msapplication-TileColor" content="#14201f">
  <meta name="msapplication-TileImage" content="icon-192.png">
  <link rel="stylesheet" href="style.css">
  <script>
    // tema sayfa çizilmeden önce uygulanır (beyaz parlama olmasın); kayıtlı seçim yoksa sistem tercihi
    (function () {
      var t;
      try { t = localStorage.getItem('np_theme'); } catch (e) {}
      if (t !== 'dark' && t !== 'light') t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = t;
    })();
  </script>
</head>
<body>
  <div id="app"></div>
  <script src="i18n.js"></script>
  <script src="i18n-en.js"></script>
  <script src="api.js"></script>
  <script src="app.js"></script>
</body>
</html>
